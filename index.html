<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ares-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0a0b0d" />
    <!-- Marks JavaScript as available before first paint, so a moment can wait to be seen
         without hiding anything when scripts never run. -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Image loading strategy
         ----------------------
         This file used to carry 22 `rel="prefetch" as="image"` links, which
         speculatively pulled ~10 MB on EVERY page load regardless of where
         the visitor actually went. That competed with the LCP image for
         bandwidth and was punishing on mobile.

         Replaced by a route-aware preload: each route declares its own hero
         in src/seo/routes.json (`preloadImage`), and <Seo> emits a single
         `rel="preload" as="image" fetchpriority="high"` for just that image.
         One right image instead of twenty-two speculative ones. -->

    <!-- Default head tags. Helmet replaces these per route; `data-rh="true"`
         marks the ones it manages so we never end up with duplicates in the
         prerendered HTML. The page title needs no marker (Helmet updates it
         in place). Values mirror the Home route in src/seo/routes.json. -->
    <title>Security Guard Services in Colorado Springs | Ares Security</title>
    <meta
      data-rh="true"
      name="description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />

    <!-- Site-wide structured data. Organization + LocalBusiness only; no
         ratings or reviews, and no geo/openingHours until the exact Google
         Business Profile values are confirmed. Page-level Service and
         BreadcrumbList nodes are emitted per route by <Seo>. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aressecurity.co/#organization",
            "name": "Ares Security LLC",
            "legalName": "ARES SECURITY LLC",
            "alternateName": "Ares Security",
            "url": "https://aressecurity.co",
            "logo": "https://aressecurity.co/ares-logo.png",
            "email": "contact@aressecurity.co",
            "telephone": "+1-719-696-3966",
            "foundingDate": "2021",
            "naics": "561612",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "413 Westmark Ave",
              "addressLocality": "Colorado Springs",
              "addressRegion": "CO",
              "postalCode": "80906",
              "addressCountry": "US"
            },
            "sameAs": [
              "https://www.linkedin.com/company/aressecurity",
              "https://www.indeed.com/cmp/Ares-Security-1"
            ]
          },
          {
            "@type": "LocalBusiness",
            "@id": "https://aressecurity.co/#localbusiness",
            "name": "Ares Security LLC",
            "url": "https://aressecurity.co",
            "image": "https://aressecurity.co/images/capabilities-hero.jpg",
            "logo": "https://aressecurity.co/ares-logo.png",
            "description": "Woman-owned, WOSB- and WBENC-certified security firm in Colorado Springs providing armed and unarmed security officers, patrol, access control, and event security across Colorado Springs, Denver, and Pueblo.",
            "telephone": "+1-719-696-3966",
            "email": "contact@aressecurity.co",
            "foundingDate": "2021",
            "naics": "561612",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "413 Westmark Ave",
              "addressLocality": "Colorado Springs",
              "addressRegion": "CO",
              "postalCode": "80906",
              "addressCountry": "US"
            },
            "areaServed": [
              { "@type": "City", "name": "Colorado Springs", "containedInPlace": { "@type": "State", "name": "Colorado" } },
              { "@type": "City", "name": "Denver", "containedInPlace": { "@type": "State", "name": "Colorado" } },
              { "@type": "City", "name": "Pueblo", "containedInPlace": { "@type": "State", "name": "Colorado" } }
            ],
            "parentOrganization": { "@id": "https://aressecurity.co/#organization" },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Security services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Armed security officers" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Unarmed security officers" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foot and mobile patrol" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Access control and visitor management" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Event security and surge coverage" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Escort officers" } }
              ]
            },
            "sameAs": [
              "https://www.linkedin.com/company/aressecurity",
              "https://www.indeed.com/cmp/Ares-Security-1"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/image-slot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
