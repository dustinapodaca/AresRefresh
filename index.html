    <!-- Image loading strategy
         ----------------------
         This file used to carry 22 `rel="prefetch" as="image"` links, which
         speculatively pulled ~10 MB on EVERY page load regardless of where
         the visitor actually went. That competed with the LCP image for
         bandwidth and was punishing on mobile.

         Replaced by a route-aware preload: each route declares its own hero
         in src/seo/routes.json (`preloadImage`), and <Seo> emits a single
         `rel="preload" as="image" fetchpriority="high"` for just that image.
         One right image instead of twenty-two speculative ones. -->

    <!-- Default head tags. Helmet replaces these per route; `data-rh="true"`
         marks the ones it manages so we never end up with duplicates in the
         prerendered HTML. The page title needs no marker (Helmet updates it
         in place). Values mirror the Home route in src/seo/routes.json. -->
    <title>Security Guard Services in Colorado Springs | Ares Security</title>
    <meta
      data-rh="true"
      name="description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />

            },

          {

            "telephone": "+1-719-696-3966",

  <body>
    <!-- Refraction filter for .glass-card-figma (Figma Glass: Refraction 62,
         Depth 100). CSS has no refraction property, so the backdrop is warped
         with two chained feDisplacementMap passes.

         Each pass uses a gradient map whose UNUSED channel is held at 128
         (= zero displacement), so the horizontal pass moves pixels only on X
         and the vertical pass only on Y.

         Each map is a FULL linear ramp (0 -> 255), which means displacement is
         zero at the centre and grows to +/- scale/2 at the edges in opposite
         directions. That stretches the backdrop outward like a magnifying lens
         and produces the large smooth lobes the Figma render shows. An
         edge-banded map instead confines the warp to a thin border, which
         reads as a hard rim rather than as glass.

         Chromium-only: Safari and Firefox ignore url() in backdrop-filter and
         fall back to the plain frost defined in index.css. -->
    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute;width:0;height:0;overflow:hidden">
      <filter id="ares-glass-refraction" x="0" y="0" width="100%" height="100%"
              color-interpolation-filters="sRGB">
        <!-- X map: R ramps 0->255 across the outer 8% bands, G pinned to 128 -->
        <feImage preserveAspectRatio="none" result="mapX"
          href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='460' height='234'&gt;&lt;defs&gt;&lt;linearGradient id='x' x1='0' y1='0' x2='1' y2='0'&gt;&lt;stop offset='0' stop-color='rgb(0,128,128)'/&gt;&lt;stop offset='1' stop-color='rgb(255,128,128)'/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;&lt;rect width='460' height='234' fill='url(%23x)'/&gt;&lt;/svg&gt;" />
        <feDisplacementMap in="SourceGraphic" in2="mapX" scale="52"
                           xChannelSelector="R" yChannelSelector="G" result="warpX" />
        <!-- Y map: G ramps 0->255 across the outer 15% bands, R pinned to 128 -->
        <feImage preserveAspectRatio="none" result="mapY"
          href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='460' height='234'&gt;&lt;defs&gt;&lt;linearGradient id='y' x1='0' y1='0' x2='0' y2='1'&gt;&lt;stop offset='0' stop-color='rgb(128,0,128)'/&gt;&lt;stop offset='1' stop-color='rgb(128,255,128)'/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;&lt;rect width='460' height='234' fill='url(%23y)'/&gt;&lt;/svg&gt;" />
        <feDisplacementMap in="warpX" in2="mapY" scale="52"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/image-slot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
