<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Home hero: can this browser run the terrain? Sets <html data-terrain> before the first
         paint, so the hero shows the terrain or its still from the start, never one then the
         other (2026-10-18). The same check as src/lib/terrainSupport.ts, minified; its sha256 is
         allowed in public/_headers, so update that hash whenever this line changes. -->
    <script>(function(){if(location.pathname!=='/')return;var m='still';try{if(!navigator.webdriver&&!matchMedia('(prefers-reduced-motion: reduce)').matches){var g=document.createElement('canvas').getContext('webgl2');if(g){var i=g.getExtension('WEBGL_debug_renderer_info'),r=i?String(g.getParameter(i.UNMASKED_RENDERER_WEBGL)):'',l=g.getExtension('WEBGL_lose_context');l&&l.loseContext();if(!/swiftshader|llvmpipe|software/i.test(r))m='live'}}}catch(e){}document.documentElement.setAttribute('data-terrain',m)})();</script>
    <!-- Browser tab, bookmark, and home-screen icons (the set began as a copy of the live site's,
         2026-10-09; its mark is #c4c8ce, lighter than the old live site's #8a8a8a). New file names
         whenever the icon changes (v3, 2026-10-19), so browsers and Google fetch it again. -->
    <link rel="icon" href="/favicon-v3.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-v3-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-v3-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (src/fonts.css, public/fonts/). The two the first screen needs
         start downloading with the page instead of after the stylesheet. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#000000" />
    <!-- AI discovery: an Agentic Resource Discovery catalog (rel=ard is the current spec;
         rel=ai-catalog is its predecessor, still read by Lighthouse) and the llms.txt summary. -->
    <link rel="ard" type="application/json" href="/.well-known/ard.json" />
    <link rel="ai-catalog" type="application/json" href="/.well-known/ai-catalog.json" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Ares Security for AI assistants" />
    <meta name="color-scheme" content="dark" />
    <!-- The site's author (owner, 2026-10-19); the same Person is in the JSON-LD below. -->
    <meta name="author" content="Dustin Apodaca" />
    <!-- Without JavaScript, moments that wait to be seen (the location maps) play on load. -->
    <noscript><style>.ds-loc-map .ds-loc-route, .ds-loc-map .ds-loc-pulse { animation-play-state: running !important; }</style></noscript>

    <!-- Image loading strategy
         ----------------------
         This file used to carry 22 `rel="prefetch" as="image"` links, which
         speculatively pulled ~10 MB on EVERY page load regardless of where
         the visitor actually went. That competed with the LCP image for
         bandwidth and was punishing on mobile.

         Replaced by a route-aware preload: each route declares its own hero
         in src/seo/routes.json (`preloadImage`), and <Seo> emits a single
         `rel="preload" as="image" fetchpriority="high"` for just that image.
         One right image instead of twenty-two speculative ones. -->

    <!-- Default head tags. Helmet replaces these per route; `data-rh="true"`
         marks the ones it manages so we never end up with duplicates in the
         prerendered HTML. The page title needs no marker (Helmet updates it
         in place). Values mirror the Home route in src/seo/routes.json. -->
    <title>Security Guard Services in Colorado Springs | Ares Security</title>
    <meta
      data-rh="true"
      name="description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />
